[package]
name = "execs-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
description = "TF2 finder, settings, write-lock, and profile library (no Tauri / WebKit)"

[dependencies]
# Already in the graph through zip. VPK entry CRCs are checked over every stock
# particle file on each preloader apply or profile switch.
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
sha2 = "0.10"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Dropbox-hosted HUDs in hud-db are 7z archives without exception. This is the
# maintained fork; recent releases bound attacker-controlled header counts and
# fixed malformed-archive panics in the abandoned original.
sevenz-rust2 = { version = "0.22.2", default-features = false }
# Extraction only; the bundled UnRAR terms are included in packaged notices.
unrar-ng-sys = "=0.7.7"
tempfile = "3"
# Pure Rust MP3 and Ogg Vorbis decoding for hit and kill sounds; the decoded
# samples go through the existing WAV preparation. ID3v2 tags start most MP3s.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "id3v2"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Free space of one volume (`GetDiskFreeSpaceExW`); the same windows release
# sysinfo already builds, so no new crate enters the graph.
windows = { version = "0.57", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
# `statvfs` for the free space of one mount; already in the graph via sysinfo.
libc = "0.2"

[features]
# The `examples/` probes are read-only field tools pointed at a real TF2
# install, not product surface. Gating them keeps them out of every
# `cargo test` / `cargo check`; run one with `--features probes`.
probes = []

[[example]]
name = "inventory_metadata_probe"
required-features = ["probes"]

[[example]]
name = "mdl_probe"
required-features = ["probes"]

[[example]]
name = "viewmodel_source_probe"
required-features = ["probes"]

[[example]]
name = "viewmodel_items_probe"
required-features = ["probes"]

[[example]]
name = "viewmodel_scripts_probe"
required-features = ["probes"]

[[example]]
name = "viewmodel_raw_rotation_probe"
required-features = ["probes"]

[[example]]
name = "viewmodel_weapon_mdl_probe"
required-features = ["probes"]

[[example]]
name = "viewmodel_group_weight_probe"
required-features = ["probes"]

[[example]]
name = "viewmodel_vpk_candidate_probe"
required-features = ["probes"]

[[example]]
name = "pack_probe"
required-features = ["probes"]

[[example]]
name = "vtf_probe"
required-features = ["probes"]

[[example]]
name = "pcf_probe"
required-features = ["probes"]
