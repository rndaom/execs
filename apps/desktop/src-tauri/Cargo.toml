[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "execs"
version = "0.1.0"
description = "TF2 desktop companion"
authors = ["rndaom"]
edition = "2021"

[lib]
name = "execs_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
execs-core = { path = "core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# Required by tauri::generate_context! macro expansion, not by our own code.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# The write gate's mutex. Must be tokio's (not std's): the guard is held
# across `.await` in every async command, and std's would also bring back
# poisoning.
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# panic = "abort" was removed deliberately: with abort, one panic in any
# background thread (lock poller, hud fetch workers, tokio tasks) kills the
# whole app with no UI and no log. Unwinding keeps a stray panic survivable.
strip = true
