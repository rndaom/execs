<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>execs</title>
    <!-- The startup screen draws before any script runs, so the window opens on
         the page colour and the spinning emblem instead of a blank frame.
         components/BootSplash.tsx renders the same markup and takes over in
         place. Its styles stay in a linked file: Tauri adds a CSP nonce to every
         inline style element, which makes release builds ignore 'unsafe-inline'
         and block the styles CodeMirror adds at runtime. -->
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash-veil"></div>
        <span class="boot-splash-emblem"><!--boot-emblem--></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
