[workspace]

[package]
name = "execs-v021-fixture-harness"
version = "0.0.0"
edition = "2021"

[dependencies]
old_core = { package = "execs-core", path = "../tagged-source/apps/desktop/src-tauri/core" }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The tagged workspace builds this local copy, not the crates.io package.
[patch.crates-io]
unrar-ng-sys = { path = "../tagged-source/apps/desktop/src-tauri/vendor/unrar-ng-sys" }
