name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Lint & format
        run: pnpm check
      - name: Desktop frontend
        run: pnpm --filter @execs/desktop build
  desktop-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Finder and write-lock units
        run: cargo test --manifest-path apps/desktop/src-tauri/core/Cargo.toml --locked
      - name: OpenNext production build (workerd compatibility gate)
        run: pnpm --filter @execs/web exec opennextjs-cloudflare build
      - name: Playwright smoke
        working-directory: apps/web
        run: |
          pnpm exec playwright install chromium --with-deps
          pnpm exec playwright test e2e/smoke.spec.ts
        env:
          CI: "true"
      # Deploy runs manually via `pnpm deploy` until a wrangler OIDC token is configured.
