name: CI

on:
  push:
    branches: [main, "rndaom/release-*"]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only || steps.fallback.outputs.docs_only }}
    steps:
      - name: Default to full CI
        id: fallback
        run: echo "docs_only=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        id: merge-checkout
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        id: node
        if: github.event_name == 'pull_request' && steps.merge-checkout.outcome == 'success'
        continue-on-error: true
        with:
          node-version: 24
      - name: Classify documentation-only PR
        id: paths
        if: github.event_name == 'pull_request' && steps.node.outcome == 'success'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Run the classifier from the trusted base, so a PR cannot alter it
          # to skip its own checks. A missing base script runs full CI.
          git show "${BASE_SHA}:scripts/ci-docs-only.mjs" > "$RUNNER_TEMP/ci-docs-only.mjs"
          node "$RUNNER_TEMP/ci-docs-only.mjs"

  inventory-probe:
    needs: classify
    if: always() && !cancelled()
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Documentation-only PR
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "Markdown under docs/design changed; full tests are unnecessary."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs_only != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.docs_only != 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          workspaces: tools/inventory-probe
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --manifest-path tools/inventory-probe/Cargo.toml --check
        if: needs.classify.outputs.docs_only != 'true'
      - run: cargo clippy --manifest-path tools/inventory-probe/Cargo.toml --all-targets --locked -- -D warnings
        if: needs.classify.outputs.docs_only != 'true'
      - run: cargo test --manifest-path tools/inventory-probe/Cargo.toml --locked
        if: needs.classify.outputs.docs_only != 'true'

  frontend:
    needs: classify
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only PR
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "Markdown under docs/design changed; full tests are unnecessary."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs_only != 'true'
      - uses: pnpm/action-setup@v4
        if: needs.classify.outputs.docs_only != 'true'
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.classify.outputs.docs_only != 'true'
      - name: Unit tests
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm test
      - name: Lint & format
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm check
      - name: Desktop frontend
        if: needs.classify.outputs.docs_only != 'true'
        run: pnpm --filter @execs/desktop build

  rust-linux:
    needs: classify
    if: always() && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - name: Documentation-only PR
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "Markdown under docs/design changed; full tests are unnecessary."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs_only != 'true'
      - name: Install Linux dependencies
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev zlib1g-dev patchelf curl python3-cryptography
      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.docs_only != 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Format
        if: needs.classify.outputs.docs_only != 'true'
        run: cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Clippy
        if: needs.classify.outputs.docs_only != 'true'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Tests
        if: needs.classify.outputs.docs_only != 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --locked
      - name: Product proxy binding loopback probe
        if: needs.classify.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: /usr/bin/python3 tools/d8-product-proxy-probe.py
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.docs_only != 'true'
        with:
          node-version: 24
      - name: Linux advisory disposition
        if: needs.classify.outputs.docs_only != 'true'
        run: node scripts/check-glib-disposition.mjs

  rust-windows:
    needs: classify
    if: always() && !cancelled()
    runs-on: windows-latest
    steps:
      - name: Documentation-only PR
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "Markdown under docs/design changed; full tests are unnecessary."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs_only != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.docs_only != 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Clippy
        if: needs.classify.outputs.docs_only != 'true'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Tests
        if: needs.classify.outputs.docs_only != 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --locked

  pinned-huds-linux:
    needs: classify
    if: always() && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - name: Documentation-only PR
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "Markdown under docs/design changed; full tests are unnecessary."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs_only != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.docs_only != 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          workspaces: apps/desktop/src-tauri
          # Restore the base cache written by rust-linux; never race its save.
          shared-key: rust-linux
          save-if: false
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.docs_only != 'true'
        with:
          node-version: 24
      - name: Pinned HUD installation and option semantics
        if: needs.classify.outputs.docs_only != 'true'
        run: node scripts/verify-pinned-huds.mjs

  pinned-huds-windows:
    needs: classify
    if: always() && !cancelled()
    runs-on: windows-latest
    steps:
      - name: Documentation-only PR
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "Markdown under docs/design changed; full tests are unnecessary."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs_only != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.docs_only != 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          workspaces: apps/desktop/src-tauri
          # Restore the base cache written by rust-windows; never race its save.
          shared-key: rust-windows
          save-if: false
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.docs_only != 'true'
        with:
          node-version: 24
      - name: Pinned HUD installation and option semantics
        if: needs.classify.outputs.docs_only != 'true'
        run: node scripts/verify-pinned-huds.mjs

  ci-gate:
    name: CI gate
    needs: [classify, inventory-probe, frontend, rust-linux, rust-windows, pinned-huds-linux, pinned-huds-windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          CLASSIFY: ${{ needs.classify.result }}
          INVENTORY: ${{ needs.inventory-probe.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST_LINUX: ${{ needs.rust-linux.result }}
          RUST_WINDOWS: ${{ needs.rust-windows.result }}
          PINNED_HUDS_LINUX: ${{ needs.pinned-huds-linux.result }}
          PINNED_HUDS_WINDOWS: ${{ needs.pinned-huds-windows.result }}
        run: |
          for result in "$CLASSIFY" "$INVENTORY" "$FRONTEND" "$RUST_LINUX" "$RUST_WINDOWS" "$PINNED_HUDS_LINUX" "$PINNED_HUDS_WINDOWS"; do
            test "$result" = success || exit 1
          done
