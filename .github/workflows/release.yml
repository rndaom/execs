name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate versions and release state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(node scripts/release-version.mjs "$GITHUB_REF_NAME")
          else
            version=$(node scripts/release-version.mjs)
          fi
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || echo none)" = false ]; then
            echo "v$version is already public; refusing to replace its assets." >&2
            exit 1
          fi
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Verify packaged third-party notices
        run: node scripts/third-party-notices.mjs --check
      - name: Include Linux system-library notices
        if: runner.os == 'Linux'
        run: |
          python3 scripts/linux-notices.py
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: execs v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseBody: Candidate build; release notes follow verification.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
      - name: Build isolated updater probe
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features release-probes --example updater_probe
      - name: Windows installer and updater smoke
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke-packages.mjs
      - name: Linux packages and updater smoke
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a node scripts/smoke-packages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/execs-package-smoke/*.json

  verify:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify both signed artifacts and write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node scripts/release-version.mjs)
          tag="v$version"
          gh release download "$tag" --dir "$RUNNER_TEMP/candidate" --pattern '*.exe' --pattern '*.AppImage' --pattern '*.sig' --pattern latest.json
          gh api "repos/$GH_REPO/releases/tags/$tag" > "$RUNNER_TEMP/candidate/release.json"
          node scripts/verify-release.mjs "$RUNNER_TEMP/candidate" "$version"
          gh release upload "$tag" "$RUNNER_TEMP/candidate/latest.json" --clobber
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/release-commit.json",JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID},null,2)+"\n")'
          gh release upload "$tag" "$RUNNER_TEMP/release-commit.json" --clobber

  publish:
    needs: [verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
