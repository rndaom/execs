name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Version guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conf_version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "v${conf_version}" ]; then
              echo "Pushed tag '$GITHUB_REF_NAME' does not match tauri.conf.json version '$conf_version' (expected 'v${conf_version}')." >&2
              exit 1
            fi
          else
            # A manual run must never upload into a release users already have.
            if [ "$(gh release view "v${conf_version}" --json isDraft --jq .isDraft 2>/dev/null || echo none)" = "false" ]; then
              echo "v${conf_version} is already published; bump the version before building again." >&2
              exit 1
            fi
          fi
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional. Without a registered imgur client id the HUD pane opens
          # imgur albums in the browser instead of loading them in-app.
          EXECS_IMGUR_CLIENT_ID: ${{ secrets.EXECS_IMGUR_CLIENT_ID }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: execs v__VERSION__
          releaseBody: See the assets to download this version and install.
          # Draft until the publish job below has seen both platforms' assets
          # and a complete latest.json. A live release with a half-populated
          # updater manifest would push a broken update to the other platform.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

  # workflow_dispatch runs stay drafts on purpose: only a real version tag publishes.
  publish:
    needs: [build]
    if: ${{ github.event_name == 'push' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify both platforms shipped, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Release assets:"
          echo "$assets"

          if ! echo "$assets" | grep -Eqi '\.(exe|nsis\.zip|msi)$'; then
            echo "No Windows installer asset (.exe / .nsis.zip / .msi) on $TAG." >&2
            exit 1
          fi
          if ! echo "$assets" | grep -Eqi '\.AppImage$'; then
            echo "No Linux .AppImage asset on $TAG." >&2
            exit 1
          fi
          if ! echo "$assets" | grep -Fqx 'latest.json'; then
            echo "No latest.json on $TAG." >&2
            exit 1
          fi

          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          for platform in windows-x86_64 linux-x86_64; do
            if [ "$(jq -r --arg p "$platform" '.platforms[$p].url // empty' "$RUNNER_TEMP/latest.json")" = "" ]; then
              echo "latest.json has no '$platform' entry — refusing to publish a partial updater manifest." >&2
              jq . "$RUNNER_TEMP/latest.json" >&2
              exit 1
            fi
          done
          if [ "$(jq -r '.version' "$RUNNER_TEMP/latest.json")" != "${TAG#v}" ]; then
            echo "latest.json version does not match $TAG." >&2
            exit 1
          fi

          # The .deb is a first-install package only: the updater would run
          # dpkg through pkexec and prompt for a password. AppImage users keep
          # the linux-x86_64 / -appimage entries.
          jq 'del(.platforms["linux-x86_64-deb"])' "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/latest.trimmed.json"
          mv "$RUNNER_TEMP/latest.trimmed.json" "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber

          gh release edit "$TAG" --draft=false
