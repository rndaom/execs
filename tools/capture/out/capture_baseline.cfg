// execs capture baseline — exec once per session, and again after any dxlevel restart
sv_cheats 1
cl_drawhud 0
crosshair 0
r_drawviewmodel 0
hide_server 1
jpeg_quality 100
mat_queue_mode 2
fov_desired 90
r_shadows 1; r_shadowrendertotexture 0
mat_picmip 1
mat_phong 0; mat_specular 1; mat_bumpmap 1
r_waterdrawreflection 0
r_rootlod 1; r_lod 1
// camera: run getpos, paste the printed setpos/setang into capture_camera.cfg
echo ">>> baseline applied — exec capture_camera next"
